<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="The Hub — an on-premises AI server, illustrated">
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5342B"/>
      <stop offset="1" stop-color="#8f2820"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94793E"/>
      <stop offset="1" stop-color="#6f5a2c"/>
    </linearGradient>
  </defs>

  <!-- vellum ground -->
  <rect width="640" height="420" fill="#E9E7E0"/>

  <!-- subtle horizon rule -->
  <line x1="60" y1="352" x2="580" y2="352" stroke="#151A22" stroke-opacity="0.16" stroke-width="1"/>

  <!-- server chassis -->
  <g stroke="#151A22" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <!-- tower body -->
    <rect x="214" y="70" width="212" height="272" rx="10" fill="#F3F1EB"/>
    <!-- inner faceplate -->
    <rect x="234" y="90" width="172" height="232" rx="6" fill="#E9E7E0"/>
  </g>

  <!-- rack unit slots (compute lanes) -->
  <g stroke="#151A22" stroke-width="1.6" stroke-opacity="0.55">
    <line x1="248" y1="118" x2="392" y2="118"/>
    <line x1="248" y1="140" x2="392" y2="140"/>
    <line x1="248" y1="162" x2="392" y2="162"/>
  </g>

  <!-- the superchip at the heart (gold — the seal's cousin) -->
  <g>
    <rect x="286" y="196" width="68" height="68" rx="6" fill="url(#chip)" stroke="#151A22" stroke-width="2.4"/>
    <rect x="300" y="210" width="40" height="40" rx="3" fill="#E9E7E0" stroke="#151A22" stroke-width="1.6"/>
    <!-- pin ticks -->
    <g stroke="#151A22" stroke-width="1.4" stroke-opacity="0.7">
      <line x1="286" y1="210" x2="278" y2="210"/><line x1="286" y1="224" x2="278" y2="224"/><line x1="286" y1="238" x2="278" y2="238"/><line x1="286" y1="252" x2="278" y2="252"/>
      <line x1="354" y1="210" x2="362" y2="210"/><line x1="354" y1="224" x2="362" y2="224"/><line x1="354" y1="238" x2="362" y2="238"/><line x1="354" y1="252" x2="362" y2="252"/>
      <line x1="300" y1="196" x2="300" y2="188"/><line x1="320" y1="196" x2="320" y2="188"/><line x1="340" y1="196" x2="340" y2="188"/>
      <line x1="300" y1="264" x2="300" y2="272"/><line x1="320" y1="264" x2="320" y2="272"/><line x1="340" y1="264" x2="340" y2="272"/>
    </g>
  </g>

  <!-- status lamps -->
  <circle cx="256" cy="300" r="5" fill="url(#seal)"/>
  <circle cx="274" cy="300" r="5" fill="none" stroke="#151A22" stroke-width="1.6"/>
  <circle cx="292" cy="300" r="5" fill="none" stroke="#151A22" stroke-width="1.6"/>

  <!-- the seal: on-premises, ours — a small vermilion stamp on the machine -->
  <g transform="translate(372,286)">
    <rect x="0" y="0" width="42" height="42" rx="5" fill="url(#seal)"/>
    <text x="21" y="18" text-anchor="middle" font-family="AppleMyungjo, 'Nanum Myeongjo', Batang, serif" font-size="15" fill="#F3F1EB">본진</text>
    <text x="21" y="34" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="7" letter-spacing="0.5" fill="#F3F1EB">HUB</text>
  </g>

  <!-- roots into local ground: sovereignty = owned where it sits -->
  <g stroke="#151A22" stroke-width="2" fill="none" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M320 342 L320 366"/>
    <path d="M320 366 C300 366 288 374 276 384"/>
    <path d="M320 366 C340 366 352 374 364 384"/>
    <path d="M320 366 L320 388"/>
  </g>
  <!-- small nodes at root tips (edge devices / community) -->
  <circle cx="276" cy="384" r="4" fill="#151A22"/>
  <circle cx="320" cy="388" r="4" fill="#151A22"/>
  <circle cx="364" cy="384" r="4" fill="#151A22"/>

  <!-- data flowing UP into the graph (owned knowledge) -->
  <g stroke="#94793E" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M180 300 C150 250 150 160 196 120" stroke-dasharray="2 8"/>
    <path d="M460 300 C490 250 490 160 444 120" stroke-dasharray="2 8"/>
  </g>
  <!-- graph nodes above (the EKG) -->
  <g>
    <circle cx="150" cy="110" r="7" fill="#E9E7E0" stroke="#151A22" stroke-width="2"/>
    <circle cx="118" cy="150" r="6" fill="#E9E7E0" stroke="#151A22" stroke-width="2"/>
    <circle cx="188" cy="150" r="6" fill="#E9E7E0" stroke="#151A22" stroke-width="2"/>
    <circle cx="490" cy="110" r="7" fill="#E9E7E0" stroke="#151A22" stroke-width="2"/>
    <circle cx="522" cy="150" r="6" fill="#E9E7E0" stroke="#151A22" stroke-width="2"/>
    <circle cx="452" cy="150" r="6" fill="#E9E7E0" stroke="#151A22" stroke-width="2"/>
    <g stroke="#151A22" stroke-width="1.4" stroke-opacity="0.6">
      <line x1="150" y1="110" x2="118" y2="150"/>
      <line x1="150" y1="110" x2="188" y2="150"/>
      <line x1="490" y1="110" x2="522" y2="150"/>
      <line x1="490" y1="110" x2="452" y2="150"/>
    </g>
  </g>
</svg>
